# ==========================================================================
#  毛玻璃博客 —— Nginx 反向代理（HTTPS 版）
#  该文件由 deploy/enable-ssl.sh 生成，请修改模板而不是线上文件。
# ==========================================================================

# HTTP：只保留证书校验，其余全部跳到 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    access_log /www/wwwlogs/__DOMAIN__.log;
    error_log  /www/wwwlogs/__DOMAIN__.error.log;

    client_max_body_size 16m;

    location ^~ /.well-known/acme-challenge/ {
        root __WEBROOT__;
        default_type text/plain;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;

    access_log /www/wwwlogs/__DOMAIN__.log;
    error_log  /www/wwwlogs/__DOMAIN__.error.log;

    client_max_body_size 16m;

    # ---- SSL ----
    # 证书从 /etc/letsencrypt/live 同步到宝塔的证书目录（与本机其它站点保持一致，
    # 也避免依赖 root-only 的 /etc/letsencrypt 目录权限）。同步由续期钩子自动完成。
    ssl_certificate     __CERTDIR__/fullchain.pem;
    ssl_certificate_key __CERTDIR__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # 注意：Let's Encrypt 自 2025 年起不再在证书里放 OCSP 地址，
    # 因此不配置 ssl_stapling（否则每次 nginx -t 都会告警）。
    add_header Strict-Transport-Security "max-age=31536000" always;

    location ^~ /.well-known/acme-challenge/ {
        root __WEBROOT__;
        default_type text/plain;
        allow all;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering    off;
    }
}
