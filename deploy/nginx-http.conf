# ==========================================================================
#  毛玻璃博客 —— Nginx 反向代理（HTTP 版，用于首次签发证书）
#  该文件由 deploy/install.sh 生成，请修改模板而不是线上文件。
# ==========================================================================
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    access_log /www/wwwlogs/__DOMAIN__.log;
    error_log  /www/wwwlogs/__DOMAIN__.error.log;

    client_max_body_size 16m;

    # Let's Encrypt 校验目录：必须优先匹配，且不能跳转
    location ^~ /.well-known/acme-challenge/ {
        root __WEBROOT__;
        default_type text/plain;
        allow all;
    }

    # Next.js 构建产物（文件名带 hash，可永久缓存）
    location /_next/static/ {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 后台上传的图片
    location /uploads/ {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering    off;
    }
}
